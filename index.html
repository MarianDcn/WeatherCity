<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Nocturn</title>
<meta name="description" content="Un oraș cyberpunk în pixel art, conectat la ora și vremea reală de la tine.">
<meta name="theme-color" content="#07060c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2307060c'/%3E%3Crect x='2' y='6' width='4' height='10' fill='%231b1233'/%3E%3Crect x='7' y='3' width='4' height='13' fill='%23130c24'/%3E%3Crect x='12' y='8' width='3' height='8' fill='%231b1233'/%3E%3Crect x='8' y='5' width='1' height='1' fill='%23ffc977'/%3E%3Crect x='9' y='8' width='1' height='1' fill='%235ef2ff'/%3E%3Crect x='3' y='9' width='1' height='1' fill='%23ff4fd8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--fg:#ece6ff;--dim:#a99fcf;--acc:#5ef2ff;--acc2:#ff4fd8;--panel:rgba(11,8,22,.78);--line:rgba(160,130,255,.22)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060c;overflow:hidden;color:var(--fg);font-family:"VT323",ui-monospace,Menlo,Consolas,monospace}
canvas#c{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 42%,transparent 60%,rgba(0,0,0,.42) 100%)}
.ui{transition:opacity .8s ease}
body.idle .ui{opacity:0;pointer-events:none}
body.idle{cursor:none}
body.nohud .ui{display:none}
#hud{position:fixed;left:max(22px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));pointer-events:none;text-shadow:0 0 10px rgba(94,242,255,.35),0 2px 0 rgba(0,0,0,.6)}
#clock{font-size:clamp(44px,7vw,72px);line-height:.9;letter-spacing:1px}
#place{font-size:22px;color:var(--dim);margin-top:4px}
#wx{font-size:22px;margin-top:2px}
#wx b{color:var(--acc);font-weight:normal}
#tag{font-size:16px;color:var(--acc2);margin-top:6px;opacity:.85;min-height:16px}
#btns{position:fixed;right:max(18px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));display:flex;gap:8px}
#btns button{width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#btns button:hover,#btns button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);box-shadow:0 0 12px rgba(94,242,255,.25)}
#btns svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square}
#panel{position:fixed;right:max(18px,env(safe-area-inset-right));top:calc(max(16px,env(safe-area-inset-top)) + 50px);width:min(300px,calc(100vw - 36px));background:var(--panel);border:1px solid var(--line);padding:14px 16px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:20px;display:none}
#panel.open{display:block}
#panel h3{margin:0 0 6px;font-size:16px;font-weight:normal;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
#panel section{margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;color:var(--dim);font:inherit;padding:4px 0;cursor:pointer}
.seg button.on{background:rgba(94,242,255,.12);color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc);margin:8px 0 2px}
.row{display:flex;gap:6px;align-items:center}
select,input[type=text]{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--fg);font:inherit;padding:3px 6px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--acc)}
.btn{background:transparent;border:1px solid var(--line);color:var(--fg);font:inherit;padding:3px 10px;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--dim)}
label.chk input{accent-color:var(--acc2)}
#mh{color:var(--acc)}
#status,#keys{font-size:15px;color:var(--dim);line-height:1.15}
#keys{margin-top:6px;opacity:.75}
@media (max-width:520px){#place,#wx{font-size:19px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<div id="hud" class="ui">
  <div id="clock">--:--</div>
  <div id="place">…</div>
  <div id="wx">…</div>
  <div id="tag"></div>
</div>

<div id="btns" class="ui">
  <button id="bSound" title="Sunet (S)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sw" d="M17 9c1.5 1.5 1.5 4.5 0 6M19.5 6.5c3 3 3 8 0 11"/></svg></button>
  <button id="bFull" title="Ecran complet (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  <button id="bPanel" title="Setări (D)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><path d="M14 5v4M18 5v4M6 15v4M10 15v4"/></svg></button>
</div>

<div id="panel" class="ui">
  <section>
    <h3>Timp</h3>
    <div class="seg"><button id="tLive" class="on">Live</button><button id="tMan">Manual</button></div>
    <input id="tSlider" type="range" min="0" max="24" step="0.05" value="22">
    <div class="row" style="justify-content:space-between"><span id="mh">22:00</span>
    <label class="chk"><input id="tLapse" type="checkbox"> Timelapse</label></div>
  </section>
  <section>
    <h3>Vreme</h3>
    <select id="wSel">
      <option value="live">Live (Open-Meteo)</option>
      <option value="clear">Senin</option>
      <option value="partly">Parțial noros</option>
      <option value="cloudy">Înnorat</option>
      <option value="fog">Ceață</option>
      <option value="drizzle">Burniță</option>
      <option value="rain">Ploaie</option>
      <option value="storm">Furtună</option>
      <option value="snow">Ninsoare</option>
    </select>
  </section>
  <section>
    <h3>Locație</h3>
    <form id="cityForm" class="row"><input id="cityIn" type="text" placeholder="Oraș (ex. Tokyo)" autocomplete="off"><button class="btn" type="submit">Caută</button></form>
    <div class="row" style="margin-top:6px"><button id="bGeo" class="btn" type="button" style="flex:1">Folosește locația mea</button></div>
  </section>
  <div id="status">Se încarcă vremea…</div>
  <div id="keys">H interfață · S sunet · F ecran complet · D setări</div>
</div>

<script>
(() => {
'use strict';

/* ───────────── utilitare ───────────── */
const P = new URLSearchParams(location.search);
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const pad = n => String(n).padStart(2, '0');
const fmtH = h => { h = ((h % 24) + 24) % 24; const m = Math.floor(h * 60 + 1e-6); return pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60); };
function rngOf(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return [c, c.getContext('2d')]; }

/* ───────────── font pixel 3×5 ───────────── */
const FONT = {
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',
  F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',
  K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',
  P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
  U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',
  Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
  '4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111',
  '9':'111101111001110',' ':'000000000000000',':':'000010000010000','-':'000000111000000','.':'000000000000010',
  '°':'010101010000000','+':'000010111010000','/':'001001010100100'
};
const textW = (s, k = 1) => s.length * 4 * k - k;
function drawText(c, s, x, y, k, col) {
  c.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]]; if (!g) continue;
    for (let j = 0; j < 15; j++) if (g.charCodeAt(j) === 49) c.fillRect(x + (i * 4 + j % 3) * k, y + ((j / 3) | 0) * k, k, k);
  }
}
const ascii = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 :\-.°+/]/g, '');

/* ───────────── paletă ───────────── */
const NEON = ['#5ef2ff', '#ff4fd8', '#ffd34f', '#7dff8a', '#ff5a6e', '#b07bff'].map(hex);
const WINC = { home: hex('#ffc46e'), home2: hex('#ffe0a3'), cool: hex('#bfefff'), mag: hex('#ff8ae2'), office: hex('#d9f1ff'), always: hex('#ffe9b8'), tv: hex('#7fb6ff') };
const WORDS = ['BAR', 'HOTEL', 'RAMEN', '24H', 'OPEN', 'NOODLE', 'CAFE', 'CLUB', 'NONSTOP', 'FARMACIE', 'TAXI', 'SUSHI', 'ARCADE', 'NEO', 'PIZZA', 'KARAOKE', 'MOTEL', 'LIVE', 'KEBAB', 'BAZAR', 'DISCO', 'VINIL'];
const SKY = {
  night: { top: hex('#040310'), mid: hex('#0f0824'), hor: hex('#34113f') },
  day:   { top: hex('#4f86b8'), mid: hex('#93b6cf'), hor: hex('#dcd2bf') },
  tw:    { top: hex('#231a4d'), mid: hex('#7a3270'), hor: hex('#ff7a45') },
  ovN:   { top: hex('#0c0a17'), mid: hex('#1a1226'), hor: hex('#3d1a42') },
  ovD:   { top: hex('#5e6672'), mid: hex('#7e8590'), hor: hex('#a3a7ad') },
  fogN: hex('#2e2539'), fogD: hex('#bdbcc2')
};

/* ───────────── vreme ───────────── */
const WX = {
  clear:   { label: 'Senin', word: 'SENIN', cloud: .05, rain: 0, snow: 0, fog: 0, storm: 0 },
  partly:  { label: 'Parțial noros', word: 'NOROS', cloud: .42, rain: 0, snow: 0, fog: 0, storm: 0 },
  cloudy:  { label: 'Înnorat', word: 'INNORAT', cloud: .9, rain: 0, snow: 0, fog: 0, storm: 0 },
  fog:     { label: 'Ceață', word: 'CEATA', cloud: .7, rain: 0, snow: 0, fog: .85, storm: 0 },
  drizzle: { label: 'Burniță', word: 'BURNITA', cloud: .85, rain: .3, snow: 0, fog: .15, storm: 0 },
  rain:    { label: 'Ploaie', word: 'PLOAIE', cloud: .95, rain: .7, snow: 0, fog: .1, storm: 0 },
  storm:   { label: 'Furtună', word: 'FURTUNA', cloud: 1, rain: 1, snow: 0, fog: .1, storm: 1 },
  snow:    { label: 'Ninsoare', word: 'ZAPADA', cloud: .9, rain: 0, snow: .7, fog: .1, storm: 0 }
};
const CODE_LABEL = { 0: 'Senin', 1: 'Predominant senin', 2: 'Parțial noros', 3: 'Înnorat', 45: 'Ceață', 48: 'Ceață cu chiciură',
  51: 'Burniță slabă', 53: 'Burniță', 55: 'Burniță deasă', 56: 'Burniță înghețată', 57: 'Burniță înghețată',
  61: 'Ploaie slabă', 63: 'Ploaie', 65: 'Ploaie puternică', 66: 'Ploaie înghețată', 67: 'Ploaie înghețată',
  71: 'Ninsoare slabă', 73: 'Ninsoare', 75: 'Ninsoare puternică', 77: 'Grăunțe de zăpadă',
  80: 'Averse slabe', 81: 'Averse', 82: 'Averse puternice', 85: 'Averse de ninsoare', 86: 'Averse de ninsoare',
  95: 'Furtună', 96: 'Furtună cu grindină', 99: 'Furtună cu grindină' };
const INTENS = { 51: .2, 53: .3, 55: .45, 56: .3, 57: .45, 61: .4, 63: .7, 65: 1, 66: .5, 67: .8, 80: .45, 81: .7, 82: 1, 71: .4, 73: .7, 75: 1, 77: .3, 85: .6, 86: 1 };
function codeToWx(code, cc) {
  let k = 'clear';
  if (code === 0) k = 'clear'; else if (code <= 2) k = 'partly'; else if (code === 3) k = 'cloudy';
  else if (code === 45 || code === 48) k = 'fog';
  else if (code >= 51 && code <= 57) k = 'drizzle';
  else if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) k = 'rain';
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) k = 'snow';
  else if (code >= 95) k = 'storm';
  const w = { ...WX[k] };
  if (k === 'rain' || k === 'drizzle') w.rain = INTENS[code] ?? w.rain;
  if (k === 'snow') w.snow = INTENS[code] ?? w.snow;
  if (cc != null && (k === 'clear' || k === 'partly' || k === 'cloudy')) w.cloud = clamp(cc / 100 * .95);
  w.label = CODE_LABEL[code] || w.label;
  return w;
}

/* ───────────── stare ───────────── */
const ST = {
  lat: 45.4353, lon: 28.0080, place: 'Galați', utcOffset: null,
  temp: null, code: null, cc: null, sunrise: 7, sunset: 18.5, wind: .15, windSpd: 8,
  live: null, updated: null, err: false,
  timeMode: 'live', manualH: 22, timelapse: P.has('timelapse'),
  wxMode: WX[P.get('weather')] ? P.get('weather') : 'live',
  seed: parseInt(P.get('seed')) || 20771
};
if (P.get('time')) { const m = /^(\d{1,2})(?::(\d{2}))?$/.exec(P.get('time')); if (m) { ST.timeMode = 'manual'; ST.manualH = (+m[1] % 24) + (+(m[2] || 0)) / 60; } }
if (ST.timelapse && ST.timeMode === 'live') { ST.timeMode = 'manual'; ST.manualH = liveHour(); }

function liveHour() {
  const off = ST.utcOffset != null ? ST.utcOffset : -new Date().getTimezoneOffset() * 60;
  const d = new Date(Date.now() + off * 1000);
  return d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600 + d.getUTCMilliseconds() / 3.6e6;
}
const hourNow = () => ST.timeMode === 'live' ? liveHour() : ST.manualH;
function targetWx() {
  if (ST.wxMode !== 'live') return WX[ST.wxMode];
  if (ST.live) return ST.live;
  return WX.clear;
}
const cur = { cloud: .05, rain: 0, snow: 0, fog: 0, storm: 0, wind: .15 };
{ const t = targetWx(); Object.assign(cur, { cloud: t.cloud, rain: t.rain, snow: t.snow, fog: t.fog, storm: t.storm }); }

function traffic(h) {
  const d = [.3, .2, .12, .09, .11, .22, .5, .8, .9, .75, .7, .7, .75, .7, .7, .75, .85, 1, 1, .95, .85, .7, .55, .4];
  const i = Math.floor(h) % 24, f = h - Math.floor(h);
  return lerp(d[i], d[(i + 1) % 24], f);
}
function moonPhase() { const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14); return (((Date.now() - ref) / 864e5) % syn + syn) % syn / syn; }

/* ───────────── canvas ───────────── */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, K = 3;
const M = 24; // margine pentru parallax
let scene, sc, glow, gl, g2, g2c, g4, g4c, g8, g8c;
let layers = [], stars = [], lanes = [], beams = [], cars = [], rain = [], snow = [], drops = [], steam = [];
let cloudTex, cloudTint, cloudTintC, fgMask, fgMaskC, fg, fgC, tmp, tmpC;
let FG = {}, BB = null, ship = null;

const LAYERS = [
  { id: 'far',  depth: .22, minW: 7,  maxW: 20, minH: .22, maxH: .52, tall: .14, gap: [0, 2],  ww: 1, wh: 1, wgx: 1, wgy: 1, wm: 1, night: '#1b1233', day: '#8a91a6', haze: .5,  neon: 0,   glowA: .55, density: .38 },
  { id: 'mid',  depth: .55, minW: 13, maxW: 32, minH: .3,  maxH: .66, tall: .12, gap: [1, 6],  ww: 2, wh: 2, wgx: 2, wgy: 2, wm: 2, night: '#140c25', day: '#61687e', haze: .24, neon: .5,  glowA: .75, density: .36 },
  { id: 'near', depth: 1,   minW: 26, maxW: 54, minH: .4,  maxH: .84, tall: .1,  gap: [10, 36], ww: 3, wh: 3, wgx: 2, wgy: 3, wm: 3, night: '#0a0716', day: '#3b3f50', haze: .06, neon: .65, glowA: .9,  density: .34 }
];

function resize() {
  const iw = innerWidth, ih = innerHeight;
  K = iw < ih ? Math.max(2, Math.round(iw / 200)) : Math.max(2, Math.round(ih / 270));
  W = Math.ceil(iw / K); H = Math.ceil(ih / K);
  cv.width = W * K; cv.height = H * K;
  cv.style.width = W * K + 'px'; cv.style.height = H * K + 'px';
  [scene, sc] = mk(W, H); [glow, gl] = mk(W, H);
  [g2, g2c] = mk(W / 2, H / 2); [g4, g4c] = mk(W / 4, H / 4); [g8, g8c] = mk(W / 8, H / 8);
  for (const c of [g2c, g4c, g8c]) { c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high'; }
  genWorld();
  lastRebuild = -1e9;
}

/* ───────────── generare lume ───────────── */
function genWorld() {
  const R = rngOf(ST.seed + W * 7 + H * 13);
  const ri = (a, b) => Math.floor(a + R() * (b - a + 1));
  layers = LAYERS.map(cfg => {
    const LW = W + 2 * M;
    const [c, x] = mk(LW, H), [e, ex] = mk(LW, H);
    const L = { cfg, c, x, e, ex, b: [], wins: [], neons: [], blinks: [], dyn: [] };
    let px = -ri(0, 8);
    while (px < LW) {
      const w = ri(cfg.minW, cfg.maxW);
      let h = Math.round(H * (cfg.minH + R() * (cfg.maxH - cfg.minH)));
      if (R() < cfg.tall) h = Math.min(Math.round(h * 1.4), Math.round(H * .95));
      const top = H - h;
      const b = { x: px, w, h, top, parts: [{ x: px, y: top, w, h }], roof: [], style: R() < .62 ? 'grid' : R() < .5 ? 'bands' : 'cols', office: R() < .3 };
      if (R() < .38 && w > 10) {
        const ow = ri(2, Math.max(2, (w / 4) | 0)), h2 = ri(4, Math.max(5, (h * .14) | 0));
        b.parts.push({ x: px + ow, y: top - h2, w: w - 2 * ow, h: h2 }); b.top = top - h2;
        if (R() < .35 && w - 2 * ow > 8) { const ow2 = ow + ri(2, 3), h3 = ri(3, 8); b.parts.push({ x: px + ow2, y: b.top - h3, w: w - 2 * ow2, h: h3 }); b.top -= h3; }
      }
      if (R() < .32) {
        const ax = px + ri(2, Math.max(2, w - 3)), ah = ri(4, cfg.id === 'far' ? 16 : 24);
        b.ant = { x: ax, y: b.top - ah, h: ah };
        L.blinks.push({ x: ax, y: b.top - ah - 1, ph: R() * 6, sp: .9 + R() * .8 });
      }
      if (R() < .5) { const n = ri(1, 3); for (let i = 0; i < n; i++) { const rw = ri(2, 5), rh = ri(1, 4); b.roof.push({ x: px + ri(1, Math.max(1, w - rw - 1)), y: b.top - rh, w: rw, h: rh }); } }
      for (const p of b.parts) genWindows(L, b, p, R);
      if (cfg.neon && R() < cfg.neon && w >= 12) genNeon(L, b, R, ri);
      L.b.push(b);
      px += w + ri(cfg.gap[0], cfg.gap[1]);
    }
    return L;
  });

  // billboard pe o clădire apropiată, în zona vizibilă
  BB = null;
  const near = layers[2];
  const cands = near.b.filter(b => b.w >= 30 && b.x > M + W * .12 && b.x + b.w < M + W * .58 && b.h > H * .5);
  if (cands.length) {
    const b = cands.sort((a, c) => c.w - a.w)[0];
    const k = b.w >= 50 ? 2 : 1;
    const bw = Math.min(b.w - 4, k === 2 ? 46 : 26), bh = k === 2 ? 16 : 9;

function genWindows(L, b, p, R) {

/* nori: textură value-noise periodică pe orizontală */
function genClouds(R) {

  [cloudTex] = mk(cw, ch); const cx = cloudTex.getContext('2d');

    const c = hash(((x0 % per) + per) % per, y0 + 1, o), e = hash((((x0 + 1) % per) + per) % per, y0 + 1, o);

}

  const mw = twoPanes ? Math.max(2, F - 2) : 0, mx = twoPanes ? Math.round(W * .63) : W - F;

/* ───────────── mediu (culori + lumină) pe cadru ───────────── */
function computeEnv(t) {
  const h = ((hourNow() % 24) + 24) % 24;
  const sr = ST.sunrise, ss = ST.sunset;
  const day = sm((h - sr + .6) / 1.2) * sm((ss + .6 - h) / 1.2);
  const tw = clamp(Math.max(1 - Math.abs(h - sr) / 1.1, 1 - Math.abs(h - ss) / 1.1, 0));
  const W_ = cur;

  const twk = tw * (1 - W_.cloud * .7);
  top = mix(top, SKY.tw.top, twk * .55); mid = mix(mid, SKY.tw.mid, twk * .8); hor = mix(hor, SKY.tw.hor, twk);
  const ovk = W_.cloud * .82;
  top = mix(top, mix(SKY.ovN.top, SKY.ovD.top, day), ovk); mid = mix(mid, mix(SKY.ovN.mid, SKY.ovD.mid, day), ovk); hor = mix(hor, mix(SKY.ovN.hor, SKY.ovD.hor, day), ovk);

  cloudCol = mix(cloudCol, hex('#ff9a6e'), twk * .8);
  cloudCol = mix(cloudCol, mix(hex('#2b1934'), hex('#8c919b'), day), W_.cloud * .6);
  cloudCol = mix(cloudCol, fogc, W_.fog * .5);

    cloud: W_.cloud, rain: W_.rain, snow: W_.snow, fog: W_.fog, storm: W_.storm, wind: W_.wind };
}

function isLit(w, h, E) {

    case 'empty': return false;
    case 'always': return true;
    case 'office': return h >= w.ofA && h < w.ofB && (E.day < .9 || E.cloud > .7 || w.gloom);
    default: {
      const he = h < 12 ? h + 24 : h;
      if (he >= E.ss + w.ao && he < w.bed) return true;
      if (w.early && h >= w.wk && h < E.sr + w.wo) return true;
      if (w.gloom && E.day > .3 && E.cloud > .75 && h > 9 && h < E.ss) return true;
      return false;
    }

}

function layerColor(L, E) {
  const c = L.cfg;
  const haze = clamp(c.haze + E.fog * (c.id === 'near' ? .22 : c.id === 'mid' ? .42 : .5));
  let bc = mix(hex(c.night), hex(c.day), E.day * (1 - E.cloud * .35));

  const bc = layerColor(L, E); L.bc = bc;
  const edge = mix(bc, mix(E.rim, E.hor, .5), .12 + .08 * E.n);
  x.fillStyle = rgba(bc);

  }
  x.fillStyle = rgba(edge);
  for (const b of L.b) for (const p of b.parts) { x.fillRect(p.x, p.y, p.w, 1); x.fillRect(p.x, p.y, 1, p.h); }

function composeFg(E) {

/* ───────────── rebuild periodic ───────────── */

/* ───────────── update ───────────── */

  for (const ln of lanes) { ln.acc += dt * (.06 + .34 * tr); if (ln.acc > 1) { ln.acc -= .4 + Math.random() * 1.6; spawnCar(ln); } }
  for (const c of cars) c.x += c.v * c.dir * dt;

  // navă cu ecran

  for (const f of snow) { f.y += f.v * dt; f.x += (Ev.wind * 10 + Math.sin(t * f.f + f.p) * 6) * dt * f.z; if (f.y > H) Object.assign(f, newFlake(false)); if (f.x < -4) f.x += W + 8; if (f.x > W + 4) f.x -= W + 8; }

  if (flash > .02) { sc.fillStyle = `rgba(200,210,255,${flash * .12})`; sc.fillRect(0, 0, W, H); }
  // obiectele din prim-plan blochează strălucirea
  gl.globalCompositeOperation = 'destination-out'; gl.globalAlpha = 1; gl.drawImage(fgMask, 0, 0);
  gl.globalCompositeOperation = 'source-over'; gl.globalAlpha = 1;
  present(Ev);
}
function present(Ev) {
  g2c.clearRect(0, 0, g2.width, g2.height); g2c.drawImage(glow, 0, 0, g2.width, g2.height);
  g4c.clearRect(0, 0, g4.width, g4.height); g4c.drawImage(g2, 0, 0, g4.width, g4.height);
  g8c.clearRect(0, 0, g8.width, g8.height); g8c.drawImage(g4, 0, 0, g8.width, g8.height);
  const cw = cv.width, ch = cv.height;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = false;
  ctx.drawImage(scene, 0, 0, cw, ch);
  const k = (.45 + .55 * Ev.n) * (1 + Ev.fog * .35);
  ctx.globalCompositeOperation = 'lighter'; ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = clamp(.35 * k); ctx.drawImage(glow, 0, 0, cw, ch);
  ctx.globalAlpha = clamp(.45 * k); ctx.drawImage(g2, 0, 0, cw, ch);
  ctx.globalAlpha = clamp(.55 * k); ctx.drawImage(g4, 0, 0, cw, ch);
  ctx.globalAlpha = clamp(.6 * k); ctx.drawImage(g8, 0, 0, cw, ch);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

/* ───────────── sunet (Web Audio, generat) ───────────── */
const Snd = {
  ac: null, on: false,
  init() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    const ac = this.ac = new AC();
    const len = ac.sampleRate * 2;
    const wb = ac.createBuffer(1, len, ac.sampleRate), bb = ac.createBuffer(1, len, ac.sampleRate);
    const w = wb.getChannelData(0), b = bb.getChannelData(0); let l = 0;
    for (let i = 0; i < len; i++) { const r = Math.random() * 2 - 1; w[i] = r; l = (l + .02 * r) / 1.02; b[i] = l * 3.5; }
    this.wb = wb;
    const src = buf => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
    const filt = (type, f, q = .7) => { const x = ac.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };
    const gain = v => { const g = ac.createGain(); g.gain.value = v; return g; };
    this.master = gain(0); this.master.connect(ac.destination);
    this.rainG = gain(0); this.rainG.connect(this.master);
    src(wb).connect(filt('bandpass', 2200, .5)).connect(gain(.7)).connect(this.rainG);
    src(bb).connect(filt('lowpass', 900)).connect(gain(.9)).connect(this.rainG);
    this.humG = gain(.2); this.humG.connect(this.master);
    src(bb).connect(filt('lowpass', 170)).connect(this.humG);
    this.windG = gain(0); this.windG.connect(this.master);
    const wf = filt('bandpass', 420, 1.3); src(wb).connect(wf).connect(this.windG);
    const lfo = ac.createOscillator(), lg = gain(160); lfo.frequency.value = .11; lfo.connect(lg).connect(wf.frequency); lfo.start();
    return true;
  },
  toggle() {
    if (!this.ac && !this.init()) return false;
    this.on = !this.on;
    if (this.on) this.ac.resume();
    this.master.gain.setTargetAtTime(this.on ? .7 : 0, this.ac.currentTime, .4);
    if (E) this.update(E);
    return this.on;
  },
  update(Ev) {
    if (!this.ac) return; const t = this.ac.currentTime;
    this.rainG.gain.setTargetAtTime(Ev.rain * .5, t, 1);
    this.windG.gain.setTargetAtTime(.03 + Ev.snow * .22 + Ev.fog * .1 + Ev.storm * .15 + Math.abs(Ev.wind) * .06, t, 1.5);
    this.humG.gain.setTargetAtTime(.1 + .16 * traffic(Ev.h), t, 2);
  },
  thunder(delay) {
    if (!this.on || !this.ac) return;
    const ac = this.ac, t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = this.wb; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(55, t + 3.5);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + .06); g.gain.exponentialRampToValueAtTime(.001, t + 4.2);
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t + 4.4);
  }
};

/* ───────────── date live ───────────── */
const $ = id => document.getElementById(id);
const parseH = s => { const m = /T(\d{2}):(\d{2})/.exec(s || ''); return m ? +m[1] + m[2] / 60 : null; };
async function loadWeather() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${ST.lat.toFixed(4)}&longitude=${ST.lon.toFixed(4)}` +
    `&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
  try {
    const r = await fetch(url); if (!r.ok) throw new Error(r.status);
    const j = await r.json(), c = j.current;
    ST.utcOffset = j.utc_offset_seconds;
    ST.temp = c.temperature_2m; ST.code = c.weather_code; ST.cc = c.cloud_cover;
    const sr = parseH(j.daily?.sunrise?.[0]), ss = parseH(j.daily?.sunset?.[0]);
    if (sr != null && ss != null && ss > sr) { ST.sunrise = sr; ST.sunset = ss; }
    const rad = (c.wind_direction_10m || 0) * Math.PI / 180, spd = c.wind_speed_10m || 0;
    ST.wind = clamp(-Math.sin(rad) * spd / 30, -1, 1); ST.windSpd = spd;
    ST.live = codeToWx(ST.code, ST.cc); ST.live.wind = ST.wind;
    ST.updated = new Date(); ST.err = false;
  } catch (e) { ST.err = true; }
  updateHud(true);
}
async function geocode(name) {
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=ro&format=json`);
    const j = await r.json(); const g = j.results && j.results[0];
    if (!g) return false;
    ST.lat = g.latitude; ST.lon = g.longitude; ST.place = g.name + (g.country_code ? ', ' + g.country_code : '');
    return true;
  } catch (e) { return false; }
}
async function reverseName() {
  try {
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${ST.lat}&longitude=${ST.lon}&localityLanguage=ro`);
    const j = await r.json(); const n = j.city || j.locality || j.principalSubdivision;
    if (n) { ST.place = n; updateHud(true); }
  } catch (e) {}
}
function useGeolocation(explicit) {
  return new Promise(res => {
    if (!navigator.geolocation) return res(false);
    navigator.geolocation.getCurrentPosition(p => {
      ST.lat = p.coords.latitude; ST.lon = p.coords.longitude; ST.place = 'Locația ta';
      if (explicit) store.set('nn-loc', null);
      reverseName(); res(true);
    }, () => res(false), { timeout: 8000, maximumAge: 3600e3 });
  });
}
async function initLocation() {
  if (P.get('lat') && P.get('lon')) { ST.lat = +P.get('lat'); ST.lon = +P.get('lon'); ST.place = P.get('name') || 'Coordonate'; }
  else if (P.get('city') && await geocode(P.get('city'))) {}
  else { const s = store.get('nn-loc'); if (s && s.lat != null) Object.assign(ST, s); else await useGeolocation(false); }
  await loadWeather();
}

/* ───────────── interfață ───────────── */
const sw = $('sw');
function updateHud(full) {
  const h = hourNow();
  $('clock').textContent = fmtH(h);
  if (!full) return;
  $('place').textContent = ST.place + (ST.timeMode === 'manual' ? ' · manual' : '');
  const w = targetWx();
  const lbl = ST.wxMode === 'live' ? (ST.live ? ST.live.label : 'Vreme indisponibilă') : WX[ST.wxMode].label + ' (simulat)';
  $('wx').innerHTML = `${lbl}${ST.temp != null ? ` · <b>${Math.round(ST.temp)}°C</b>` : ''}`;
  const hh = h % 24;
  $('tag').textContent = (hh >= 1 && hh < 5) ? 'orașul doarme' : (hh >= 5 && hh < ST.sunrise) ? 'se trezesc primii' : (hh >= ST.sunset - .5 && hh < ST.sunset + .7) ? 'se aprind luminile' : '';
  $('status').textContent = ST.err ? 'Nu am putut încărca vremea. Scena rulează cu vreme simulată.' :
    ST.updated ? `Open-Meteo · actualizat ${pad(ST.updated.getHours())}:${pad(ST.updated.getMinutes())} · răsărit ${fmtH(ST.sunrise)}, apus ${fmtH(ST.sunset)}` : 'Se încarcă vremea…';
  $('tLive').classList.toggle('on', ST.timeMode === 'live'); $('tMan').classList.toggle('on', ST.timeMode === 'manual');
  $('tLapse').checked = ST.timelapse; $('wSel').value = ST.wxMode;
}
function setManual(h) { ST.timeMode = 'manual'; ST.manualH = h; lastRebuild = -1e9; updateHud(true); }
$('tLive').onclick = () => { ST.timeMode = 'live'; ST.timelapse = false; lastRebuild = -1e9; updateHud(true); };
$('tMan').onclick = () => setManual(liveHour());
$('tSlider').oninput = e => { ST.timelapse = false; setManual(+e.target.value); };
$('tLapse').onchange = e => { ST.timelapse = e.target.checked; if (ST.timelapse && ST.timeMode === 'live') setManual(liveHour()); updateHud(true); };
$('wSel').onchange = e => { ST.wxMode = e.target.value; updateHud(true); };
$('cityForm').onsubmit = async e => {
  e.preventDefault(); const v = $('cityIn').value.trim(); if (!v) return;
  $('status').textContent = 'Caut…';
  if (await geocode(v)) { store.set('nn-loc', { lat: ST.lat, lon: ST.lon, place: ST.place }); ST.utcOffset = null; await loadWeather(); $('cityIn').value = ''; }
  else $('status').textContent = 'Nu am găsit orașul.';
};
$('bGeo').onclick = async () => { $('status').textContent = 'Cer acces la locație…'; if (await useGeolocation(true)) { ST.utcOffset = null; await loadWeather(); } else $('status').textContent = 'Locația nu e disponibilă.'; };
function toggleSound() { const on = Snd.toggle(); $('bSound').setAttribute('aria-pressed', on); sw.style.opacity = on ? 1 : .25; }
sw.style.opacity = .25;
$('bSound').onclick = toggleSound;
function toggleFull() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); }
$('bFull').onclick = toggleFull;
function togglePanel() { const o = $('panel').classList.toggle('open'); $('bPanel').setAttribute('aria-pressed', o); }
$('bPanel').onclick = togglePanel;
if (P.get('hud') === '0') document.body.classList.add('nohud');
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  const k = e.key.toLowerCase();
  if (k === 'h') document.body.classList.toggle('nohud');
  else if (k === 's') toggleSound();
  else if (k === 'f') toggleFull();
  else if (k === 'd') togglePanel();
  poke();
});
let idleT = 0;
function poke() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!$('panel').classList.contains('open')) document.body.classList.add('idle'); }, 4000); }
addEventListener('pointermove', e => { parT = (e.clientX / innerWidth - .5) * 2; poke(); });
addEventListener('pointerdown', poke);
let rT = 0; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(resize, 150); });

/* ───────────── buclă ───────────── */
let lastT = performance.now(), T = 0, hudT = 0, sndT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; T += dt;
  if (ST.timelapse) { ST.manualH = (ST.manualH + dt * .2) % 24; }
  const tw = targetWx(), k = 1 - Math.exp(-dt * .9);
  cur.cloud = lerp(cur.cloud, tw.cloud, k); cur.rain = lerp(cur.rain, tw.rain, k); cur.snow = lerp(cur.snow, tw.snow, k);
  cur.fog = lerp(cur.fog, tw.fog, k); cur.storm = lerp(cur.storm, tw.storm, k);
  cur.wind = lerp(cur.wind, ST.wxMode === 'live' ? ST.wind : (tw.storm ? .7 : tw.rain ? .25 : .12), k);
  E = computeEnv(T);
  const every = ST.timeMode === 'live' && !ST.timelapse ? 1000 : 110;
  if (now - lastRebuild > every) { rebuild(E); lastRebuild = now; }
  update(dt, E, T);
  render(E, T);
  if (now - hudT > 500) { updateHud(now - hudT > 500); hudT = now; if (ST.timeMode === 'manual') { $('tSlider').value = ST.manualH; $('mh').textContent = fmtH(ST.manualH); } }
  if (now - sndT > 1000) { Snd.update(E); sndT = now; }
  requestAnimationFrame(frame);
}

resize();
updateHud(true);
poke();
requestAnimationFrame(frame);
initLocation();
setInterval(loadWeather, 15 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) lastT = performance.now(); });
window.__nn = { ST, get E() { return E; } };
})();
</script>

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Nocturn</title>
<meta name="description" content="Un oraș cyberpunk în pixel art, conectat la ora și vremea reală de la tine.">
<meta name="theme-color" content="#07060c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2307060c'/%3E%3Crect x='2' y='6' width='4' height='10' fill='%231b1233'/%3E%3Crect x='7' y='3' width='4' height='13' fill='%23130c24'/%3E%3Crect x='12' y='8' width='3' height='8' fill='%231b1233'/%3E%3Crect x='8' y='5' width='1' height='1' fill='%23ffc977'/%3E%3Crect x='9' y='8' width='1' height='1' fill='%235ef2ff'/%3E%3Crect x='3' y='9' width='1' height='1' fill='%23ff4fd8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fg:#ece6ff;--dim:#aaa1cf;--acc:#5ef2ff;--acc2:#ff4fd8;--panel:rgba(11,8,22,.78);--card:rgba(10,7,22,.66);--line:rgba(160,130,255,.24);--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060c;overflow:hidden;color:var(--fg);font-family:"VT323",ui-monospace,Menlo,Consolas,monospace}
canvas#c{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 42%,transparent 60%,rgba(0,0,0,.42) 100%)}
.ui{transition:opacity .8s ease}
body.idle .ui{opacity:0;pointer-events:none}
body.idle{cursor:none}
body.nohud .ui{display:none}
#hud{position:fixed;left:max(22px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));width:min(372px,calc(100vw - 44px));pointer-events:none;z-index:2}
#clock{font-size:clamp(46px,6.4vw,76px);line-height:.95;letter-spacing:1px;text-shadow:0 0 14px rgba(94,242,255,.35),0 2px 0 rgba(0,0,0,.6)}
#place{font-family:var(--mono);font-size:13px;color:var(--dim);margin-top:12px;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#place .tagm{color:var(--acc2);border:1px solid rgba(255,79,216,.4);padding:0 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#place .mood{color:var(--acc2);opacity:.85}
#wcard{pointer-events:auto;position:relative;margin-top:14px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);font-family:var(--mono);font-size:13px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));box-shadow:0 10px 40px rgba(0,0,0,.35)}
#wcard::before{content:"";position:absolute;left:0;top:0;width:calc(100% - 16px);height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2) 70%,transparent)}
#simChip{display:flex;align-items:center;gap:8px;margin:12px 16px 0;padding:4px 8px;font-size:11.5px;color:#ffd2f5;background:rgba(255,79,216,.1);border:1px dashed rgba(255,79,216,.45)}
#simChip[hidden]{display:none}
#simChip b{font-weight:600}
#simChip button{margin-left:auto;background:none;border:1px solid rgba(255,79,216,.5);color:#ffd2f5;font:inherit;font-size:11px;padding:1px 7px;cursor:pointer}
#simChip button:hover{background:rgba(255,79,216,.18)}
.wnow{display:flex;gap:14px;align-items:center;padding:14px 16px 10px;cursor:pointer;user-select:none;-webkit-user-select:none}
#wIcon{width:60px;height:60px;image-rendering:pixelated;flex:none;filter:drop-shadow(0 0 10px rgba(180,170,255,.25))}
.wmain{flex:1;min-width:0}
.wtop{display:flex;align-items:baseline;gap:10px}
#wTemp{font-family:"VT323",monospace;font-size:62px;line-height:.75;letter-spacing:-1px}
#wCond{font-size:15px;font-weight:500;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
#wFeel{font-size:12px;color:var(--dim);margin-top:6px}
#wFeel b{color:var(--fg);font-weight:500}
#wFeel .hi{color:#ffcf8a}#wFeel .lo{color:#8fd8ff}
.chev{width:22px;height:22px;flex:none;color:var(--dim);transition:transform .3s;align-self:flex-start;margin-top:2px}
#wcard.collapsed .chev{transform:rotate(180deg)}
#wCast{margin:0 16px 12px;padding:7px 10px;border-left:2px solid rgba(160,130,255,.5);background:rgba(160,130,255,.07);font-size:12.5px;line-height:1.3}
#wCast.on{border-left-color:var(--acc);background:rgba(94,242,255,.07);color:#dffbff}
.wdet{padding:0 16px 14px;display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease,opacity .35s}
.wdet>div{min-height:0;overflow:hidden}
#wcard.collapsed .wdet{grid-template-rows:0fr;opacity:0;padding-bottom:0}
#wcard.empty .wdet,#wcard.empty #wCast{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{background:rgba(255,255,255,.035);border:1px solid rgba(160,130,255,.13);padding:7px 8px 6px;min-width:0}
.tile .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.tile .v{font-family:"VT323",monospace;font-size:26px;line-height:1;margin-top:4px;white-space:nowrap}
.tile .v small{font-size:15px;color:var(--dim)}
.tile .s{font-size:10.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.arr{width:10px;height:10px;fill:var(--acc);flex:none}
.sec{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:12px 0 4px}
.hours{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:rgba(160,130,255,.35) transparent;-webkit-overflow-scrolling:touch}
.hours::-webkit-scrollbar{height:4px}.hours::-webkit-scrollbar-thumb{background:rgba(160,130,255,.35)}
.hr{flex:0 0 44px;text-align:center;scroll-snap-align:start;padding:5px 0 4px;border:1px solid transparent}
.hr.now{border-color:rgba(94,242,255,.35);background:rgba(94,242,255,.06)}
.hr .h{font-size:10.5px;color:var(--dim)}
.hr.now .h{color:var(--acc)}
.hr img{width:32px;height:32px;image-rendering:pixelated;display:block;margin:3px auto 1px}
.hr .t{font-family:"VT323",monospace;font-size:20px;line-height:1}
.hr .p{font-size:9.5px;color:#8fe0ff;height:12px;margin-top:1px}
.hr .bar{height:2px;background:rgba(143,224,255,.13);margin:2px 7px 0}.hr .bar i{display:block;height:100%;background:#8fe0ff}
.sunrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:10px;font-size:11.5px;color:var(--dim)}
.sunrow b{color:var(--fg);font-weight:500}
.sunbar{position:relative;height:16px}
.sunbar::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:linear-gradient(90deg,rgba(255,154,60,.6),rgba(255,211,79,.8),rgba(255,154,60,.6))}
#sunDot{position:absolute;top:3px;width:10px;height:10px;margin-left:-5px;background:#ffd34f;box-shadow:0 0 10px #ffd34f}
#sunDot.night{background:#cfc6ff;box-shadow:0 0 10px #a99cff}
#sunMid{position:absolute;left:0;right:0;top:-12px;text-align:center;font-size:10.5px}
#wFoot{font-size:10.5px;color:var(--dim);opacity:.7;margin-top:10px}
#btns{z-index:3}
#panel{z-index:4}
@media (max-width:640px){
  #hud{right:max(16px,env(safe-area-inset-right));width:auto}
  #clock{font-size:52px}
  #place{max-width:calc(100vw - 190px)}
  #wcard{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));margin:0;max-height:calc(100dvh - 140px);overflow-y:auto;overscroll-behavior:contain}
  #wIcon{width:52px;height:52px}
  #wTemp{font-size:54px}
  .wnow{padding:12px 14px 8px}
  #wCast{margin:0 14px 10px}
  .wdet{padding:0 14px 12px}
  .tile .v{font-size:23px}
  #wcard.collapsed #wCast{margin-bottom:12px}
}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,1fr)}}
#btns{position:fixed;right:max(18px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));display:flex;gap:8px}
#btns button{width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#btns button:hover,#btns button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);box-shadow:0 0 12px rgba(94,242,255,.25)}
#btns svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square}
#panel{position:fixed;right:max(18px,env(safe-area-inset-right));top:calc(max(16px,env(safe-area-inset-top)) + 50px);width:min(300px,calc(100vw - 36px));background:var(--panel);border:1px solid var(--line);padding:14px 16px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:20px;display:none;max-height:calc(100dvh - 90px);overflow-y:auto}
#panel.open{display:block}
#panel h3{margin:0 0 6px;font-size:16px;font-weight:normal;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
#panel section{margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;color:var(--dim);font:inherit;padding:4px 0;cursor:pointer}
.seg button.on{background:rgba(94,242,255,.12);color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc);margin:8px 0 2px}
.row{display:flex;gap:6px;align-items:center}
select,input[type=text]{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--fg);font:inherit;padding:3px 6px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--acc)}
.btn{background:transparent;border:1px solid var(--line);color:var(--fg);font:inherit;padding:3px 10px;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--dim)}
label.chk input{accent-color:var(--acc2)}
#mh{color:var(--acc)}
#status,#keys{font-size:15px;color:var(--dim);line-height:1.15}
#keys{margin-top:6px;opacity:.75}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<div id="hud" class="ui">
  <div id="clock">--:--</div>
  <div id="place">…</div>
  <section id="wcard" class="empty" aria-label="Vremea">
    <div id="simChip" hidden>Scenă simulată: <b id="simName"></b><button id="simLive" type="button">înapoi la live</button></div>
    <div class="wnow" id="wHead" role="button" tabindex="0" aria-expanded="true">
      <img id="wIcon" alt="">
      <div class="wmain">
        <div class="wtop"><div id="wTemp">--°</div><div id="wCond">Se încarcă vremea…</div></div>
        <div id="wFeel"></div>
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>
    </div>
    <div id="wCast"></div>
    <div class="wdet"><div>
      <div class="tiles" id="wTiles"></div>
      <div class="sec">Următoarele 24 de ore</div>
      <div class="hours" id="wHours"></div>
      <div class="sunrow"><span>↑ <b id="sunRise">--:--</b></span><div class="sunbar"><span id="sunMid"></span><i id="sunDot"></i></div><span>↓ <b id="sunSet">--:--</b></span></div>
      <div id="wFoot"></div>
    </div></div>
  </section>
</div>

<div id="btns" class="ui">
  <button id="bSound" title="Sunet (S)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sw" d="M17 9c1.5 1.5 1.5 4.5 0 6M19.5 6.5c3 3 3 8 0 11"/></svg></button>
  <button id="bFull" title="Ecran complet (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  <button id="bPanel" title="Setări (D)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><path d="M14 5v4M18 5v4M6 15v4M10 15v4"/></svg></button>
</div>

<div id="panel" class="ui">
  <section>
    <h3>Timp</h3>
    <div class="seg"><button id="tLive" class="on">Live</button><button id="tMan">Manual</button></div>
    <input id="tSlider" type="range" min="0" max="24" step="0.05" value="22">
    <div class="row" style="justify-content:space-between"><span id="mh">22:00</span>
    <label class="chk"><input id="tLapse" type="checkbox"> Timelapse</label></div>
  </section>
  <section>
    <h3>Vreme</h3>
    <select id="wSel">
      <option value="live">Live (Open-Meteo)</option>
      <option value="clear">Senin</option>
      <option value="partly">Parțial noros</option>
      <option value="cloudy">Înnorat</option>
      <option value="mist">Pâclă</option>
      <option value="fog">Ceață densă</option>
      <option value="drizzle">Burniță</option>
      <option value="rain">Ploaie</option>
      <option value="heavy">Ploaie torențială</option>
      <option value="freezing">Ploaie înghețată (polei)</option>
      <option value="sleet">Lapoviță</option>
      <option value="snow">Ninsoare</option>
      <option value="blizzard">Viscol</option>
      <option value="hail">Furtună cu grindină</option>
      <option value="storm">Furtună</option>
      <option value="windy">Vânt puternic</option>
      <option value="heat">Caniculă</option>
    </select>
  </section>
  <section>
    <h3>Locație</h3>
    <form id="cityForm" class="row"><input id="cityIn" type="text" placeholder="Oraș (ex. Tokyo)" autocomplete="off"><button class="btn" type="submit">Caută</button></form>
    <div class="row" style="margin-top:6px"><button id="bGeo" class="btn" type="button" style="flex:1">Folosește locația mea</button></div>
  </section>
  <section><label class="chk"><input id="aHide" type="checkbox" checked> Ascunde interfața când stai pe loc</label></section>
  <div id="status">Se încarcă vremea…</div>
  <div id="keys">H interfață · S sunet · F ecran complet · D setări</div>
</div>

<script>
(() => {
'use strict';

/* ───────────── utilitare ───────────── */
const P = new URLSearchParams(location.search);
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const pad = n => String(n).padStart(2, '0');
const fmtH = h => { h = ((h % 24) + 24) % 24; const m = Math.floor(h * 60 + 1e-6); return pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60); };
function rngOf(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return [c, c.getContext('2d')]; }

/* ───────────── font pixel 3×5 ───────────── */
const FONT = {
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',
  F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',
  K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',
  P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
  U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',
  Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
  '4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111',
  '9':'111101111001110',' ':'000000000000000',':':'000010000010000','-':'000000111000000','.':'000000000000010',
  '°':'010101010000000','+':'000010111010000','/':'001001010100100'
};
const textW = (s, k = 1) => s.length * 4 * k - k;
function drawText(c, s, x, y, k, col) {
  c.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]]; if (!g) continue;
    for (let j = 0; j < 15; j++) if (g.charCodeAt(j) === 49) c.fillRect(x + (i * 4 + j % 3) * k, y + ((j / 3) | 0) * k, k, k);
  }
}
const ascii = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 :\-.°+/]/g, '');

/* ───────────── paletă ───────────── */
const NEON = ['#5ef2ff', '#ff4fd8', '#ffd34f', '#7dff8a', '#ff5a6e', '#b07bff'].map(hex);
const WINC = { home: hex('#ffc46e'), home2: hex('#ffe0a3'), cool: hex('#bfefff'), mag: hex('#ff8ae2'), office: hex('#d9f1ff'), always: hex('#ffe9b8'), tv: hex('#7fb6ff') };
const WORDS = ['BAR', 'HOTEL', 'RAMEN', '24H', 'OPEN', 'NOODLE', 'CAFE', 'CLUB', 'NONSTOP', 'FARMACIE', 'TAXI', 'SUSHI', 'ARCADE', 'NEO', 'PIZZA', 'KARAOKE', 'MOTEL', 'LIVE', 'KEBAB', 'BAZAR', 'DISCO', 'VINIL'];
const SKY = {
  night: { top: hex('#040310'), mid: hex('#0f0824'), hor: hex('#34113f') },
  day:   { top: hex('#4f86b8'), mid: hex('#93b6cf'), hor: hex('#dcd2bf') },
  tw:    { top: hex('#231a4d'), mid: hex('#7a3270'), hor: hex('#ff7a45') },
  ovN:   { top: hex('#0c0a17'), mid: hex('#1a1226'), hor: hex('#3d1a42') },
  ovD:   { top: hex('#5e6672'), mid: hex('#7e8590'), hor: hex('#a3a7ad') },
  fogN: hex('#2e2539'), fogD: hex('#bdbcc2')
};

/* ───────────── vreme ───────────── */
// Parametrii scenei: cloud, rain, snow, fog, storm, hail, frost (gheață pe geam), cond (geam aburit), heat, wind (semnat, -1.3..1.3), gust
const SCENE_KEYS = ['cloud', 'rain', 'snow', 'fog', 'storm', 'hail', 'frost', 'cond', 'heat', 'wind', 'gust'];
const WX = {
  clear:    { label: 'Senin',              word: 'SENIN',    cloud: .05 },
  partly:   { label: 'Parțial noros',      word: 'NOROS',    cloud: .42 },
  cloudy:   { label: 'Înnorat',            word: 'INNORAT',  cloud: .92 },
  mist:     { label: 'Pâclă',              word: 'PACLA',    cloud: .6,  fog: .35 },
  fog:      { label: 'Ceață densă',        word: 'CEATA',    cloud: .75, fog: .9, cond: .3 },
  drizzle:  { label: 'Burniță',            word: 'BURNITA',  cloud: .88, rain: .22, fog: .15, cond: .4 },
  rain:     { label: 'Ploaie',             word: 'PLOAIE',   cloud: .95, rain: .62, fog: .12, cond: .3 },
  heavy:    { label: 'Ploaie torențială',  word: 'TORENT',   cloud: 1,   rain: 1, fog: .25, wind: .45, gust: .35, cond: .45 },
  freezing: { label: 'Ploaie înghețată',   word: 'POLEI',    cloud: .95, rain: .5, fog: .15, frost: .7 },
  sleet:    { label: 'Lapoviță',           word: 'LAPOVITA', cloud: .95, rain: .4, snow: .4, fog: .15, frost: .3, cond: .3 },
  snow:     { label: 'Ninsoare',           word: 'ZAPADA',   cloud: .9,  snow: .6, fog: .12, frost: .35 },
  blizzard: { label: 'Viscol',             word: 'VISCOL',   cloud: 1,   snow: 1, fog: .45, wind: 1.2, gust: .7, frost: .75 },

/* chiciură pe geam: cristale care cresc din colțuri și margini */
function genFrost(R, panes, q) {
  let fx; [frostTex, fx] = mk(W, H);
  const img = fx.createImageData(W, H), d = img.data;
  for (const [px, py, pw, ph] of panes) {
    for (let y = py; y < py + ph; y++) for (let x = px; x < px + pw; x++) {
      const e = Math.min(x - px, px + pw - 1 - x, y - py, (py + ph - 1 - y) * .7);
      const cx = Math.min(x - px, px + pw - 1 - x), cy = Math.min(y - py, py + ph - 1 - y);
      const corner = Math.hypot(cx, cy);
      const p = Math.exp(-e / (4.5 * q)) * .9 + Math.exp(-corner / (16 * q)) * .7;
      if (R() < p * (.55 + .45 * Math.sin(x * .9 + y * 1.7) * Math.sin(x * .37 - y * .53))) {
        const i = (y * W + x) * 4, a = 90 + R() * 150;

      }

    // ramuri de cristal

      const side = Math.floor(R() * 4);

      let a = side === 0 ? 0 : side === 1 ? Math.PI : side === 2 ? Math.PI / 2 : -Math.PI / 2;

        x += Math.cos(a); y += Math.sin(a); a += (R() - .5) * .5;
        const xi = Math.round(x), yi = Math.round(y);
        if (xi < px || xi >= px + pw || yi < py || yi >= py + ph) break;
        const i = (yi * W + xi) * 4; d[i] = 235; d[i + 1] = 245; d[i + 2] = 255; d[i + 3] = 150 * (1 - s / len) + 30;
      }
    }
  }
  fx.putImageData(img, 0, 0);
}

/* ───────────── mediu (culori + lumină) pe cadru ───────────── */
function computeEnv(t) {
  const h = ((hourNow() % 24) + 24) % 24;
  const sr = ST.sunrise, ss = ST.sunset;
  const day = sm((h - sr + .6) / 1.2) * sm((ss + .6 - h) / 1.2);
  const tw = clamp(Math.max(1 - Math.abs(h - sr) / 1.1, 1 - Math.abs(h - ss) / 1.1, 0));
  const W_ = cur;
  let top = mix(SKY.night.top, SKY.day.top, day), mid = mix(SKY.night.mid, SKY.day.mid, day), hor = mix(SKY.night.hor, SKY.day.hor, day);
  const twk = tw * (1 - W_.cloud * .7);
  top = mix(top, SKY.tw.top, twk * .55); mid = mix(mid, SKY.tw.mid, twk * .8); hor = mix(hor, SKY.tw.hor, twk);
  const ovk = W_.cloud * .82;
  top = mix(top, mix(SKY.ovN.top, SKY.ovD.top, day), ovk); mid = mix(mid, mix(SKY.ovN.mid, SKY.ovD.mid, day), ovk); hor = mix(hor, mix(SKY.ovN.hor, SKY.ovD.hor, day), ovk);
  if (W_.heat > 0) { const hk = W_.heat * (.3 + .35 * day); hor = mix(hor, hex('#ffb066'), hk); mid = mix(mid, hex('#e9b58c'), hk * .7); top = mix(top, hex('#7aa2c9'), W_.heat * day * .2); }
  const fogc = mix(SKY.fogN, SKY.fogD, day);
  top = mix(top, fogc, W_.fog * .45); mid = mix(mid, fogc, W_.fog * .7); hor = mix(hor, fogc, W_.fog * .8);
  if (W_.storm > 0) { const k = 1 - W_.storm * .3 * day; top = top.map(v => v * k); mid = mid.map(v => v * k); hor = hor.map(v => v * k); }
  let rim = mix(NEON[0], NEON[1], .5 + .2 * Math.sin(t * .04));
  rim = mix(rim, hor, .35 + day * .5);
  let cloudCol = mix(hex('#3a1d4c'), hex('#dcdde4'), day);
  cloudCol = mix(cloudCol, hex('#ff9a6e'), twk * .8);
  cloudCol = mix(cloudCol, mix(hex('#2b1934'), hex('#8c919b'), day), W_.cloud * .6);
  cloudCol = mix(cloudCol, fogc, W_.fog * .5);

    cloud: W_.cloud, rain: W_.rain, snow: W_.snow, fog: W_.fog, storm: W_.storm, wind: W_.wind * gustF,
    hail: W_.hail, frost: W_.frost, cond: W_.cond, heat: W_.heat, gust: W_.gust };
}

function isLit(w, h, E) {

      if (w.gloom && E.day > .3 && E.cloud > .75 && h > 9 && h < E.ss) return true;

}

function layerColor(L, E) {

  let bc = mix(hex(c.night), hex(c.day), E.day * (1 - E.cloud * .35));

}

function composeFg(E) {

/* ───────────── rebuild periodic ───────────── */
let lastRebuild = -1e9, E = null;

/* ───────────── update ───────────── */
let flash = 0, bolt = null, boltT = 0, nextBolt = 6, parX = 0, parT = 0;
function update(dt, Ev, t) {
  // trafic aerian
  const tr = traffic(Ev.h) * (1 - Ev.storm * .4) * (1 - Ev.fog * .3);
  for (const ln of lanes) { ln.acc += dt * (.06 + .34 * tr); if (ln.acc > 1) { ln.acc -= .4 + Math.random() * 1.6; spawnCar(ln); } }
  for (const c of cars) c.x += c.v * c.dir * dt;
  cars = cars.filter(c => c.x > -M - 30 && c.x < W + M + 30);
  // navă cu ecran
  if (ship) { ship.x += ship.v * ship.dir * dt; ship.scroll += dt * 9; if (ship.x < -70 || ship.x > W + 70) { ship = null; shipTimer = 50 + Math.random() * 90; } }
  else if ((shipTimer -= dt) <= 0 && W > 160) spawnShip(Math.random() < .5 ? 1 : -1);
  // ploaie
  const wantR = Math.round(Ev.rain * W * 1.3);
  while (rain.length < wantR) rain.push(newDrop(true));
  if (rain.length > wantR) rain.length = wantR;
  for (const d of rain) { d.y += d.v * dt; d.x += Ev.wind * d.v * .3 * dt; if (d.y - d.l > H) Object.assign(d, newDrop(false)); if (d.x < -10) d.x += W + 20; if (d.x > W + 10) d.x -= W + 20; }
  // zăpadă
  const wantS = Math.round(Ev.snow * W * .9);
  while (snow.length < wantS) snow.push(newFlake(true));
  if (snow.length > wantS) snow.length = wantS;
  for (const f of snow) { f.y += f.v * dt; f.x += (Ev.wind * 38 + Math.sin(t * f.f + f.p) * 6) * dt * f.z; if (f.y > H) Object.assign(f, newFlake(false)); if (f.x < -4) f.x += W + 8; if (f.x > W + 4) f.x -= W + 8; }
  // grindină
  const wantH = Math.round(Ev.hail * W * .45);
  while (hail.length < wantH) hail.push({ x: Math.random() * (W + 20) - 10, y: Math.random() * H, v: 300 + Math.random() * 120, s: Math.random() < .3 ? 2 : 1 });
  if (hail.length > wantH) hail.length = wantH;
  for (const g of hail) { g.y += g.v * dt; g.x += Ev.wind * g.v * .2 * dt; if (g.y > H) { g.y = -Math.random() * 20; g.x = Math.random() * (W + 20) - 10; } }
  if (Ev.hail > .2 && Math.random() < Ev.hail * dt * 10) {
    const pane = FG.panes[Math.floor(Math.random() * FG.panes.length)];
    drops.push({ x: pane[0] + 2 + Math.random() * (pane[2] - 4), y: pane[1] + 2 + Math.random() * (pane[3] - 4), s: 1, vy: 0, slide: false, life: .35, age: 0, tick: true });
  }
  // resturi purtate de vânt (frunze, hârtii)
  const wantD = Math.round(clamp(Math.abs(Ev.wind) / gustF - .5) * 50 * (1 - Ev.rain * .5));
  while (debris.length < wantD) debris.push({ x: Math.random() * W, y: H * (.2 + Math.random() * .7), k: .6 + Math.random() * .8, ph: Math.random() * 6, f: 2 + Math.random() * 4, s: Math.random() < .4 ? 2 : 1, c: Math.random() });
  if (debris.length > wantD) debris.length = wantD;
  for (const b of debris) {
    b.x += Ev.wind * 120 * b.k * dt; b.y += (Math.sin(t * b.f * .5 + b.ph) * 18 + 4) * dt;
    if (b.x > W + 8 || b.x < -8 || b.y > H || b.y < 0) { b.x = Ev.wind > 0 ? -4 : W + 4; b.y = H * (.2 + Math.random() * .7); }
  }
  // picături pe geam
  if (Ev.rain > .05 && Math.random() < Ev.rain * dt * 14 && drops.length < 160 * Ev.rain) {
    const pane = FG.panes.length < 2 || Math.random() < (FG.panes[0][2] / (W - 2 * FG.F)) ? FG.panes[0] : FG.panes[1];
    drops.push({ x: pane[0] + 1 + Math.random() * (pane[2] - 3), y: pane[1] + Math.random() * (pane[3] - 3), s: Math.random() < .4 ? 2 : 1, vy: 0, slide: Math.random() < .25, life: 25 + Math.random() * 40, age: 0 });
  }
  for (const d of drops) {
    d.age += dt;
    if (d.slide && d.age > 1.5) { d.vy = Math.min(d.vy + dt * 8, 14); d.y += d.vy * dt; d.x += Math.sin(d.age * 3) * .05; }
  }
  drops = drops.filter(d => d.y < FG.sillY - 1 && d.age < d.life + (Ev.rain > .05 || d.tick ? 0 : -9999));
  // abur din cană
  const steamy = ST.temp == null ? Ev.n > .5 : (ST.temp < 16 || Ev.n > .6);
  if (steamy && Math.random() < dt * 6) steam.push({ x: FG.mugX + FG.mugW * (.3 + Math.random() * .4), y: FG.sillY - FG.mugH - 1, a: .35, ph: Math.random() * 6 });
  for (const s of steam) { s.y -= dt * 4; s.a -= dt * .09; }
  steam = steam.filter(s => s.a > 0);
  // fulgere
  if (Ev.storm > .5) {
    nextBolt -= dt;
    if (nextBolt <= 0) {
      nextBolt = 7 + Math.random() * 18; flash = 1; boltT = .22;
      bolt = makeBolt(); setTimeout(() => { flash = Math.max(flash, .7); }, 130);
      Snd.thunder(.6 + Math.random() * 2.4);
    }
  }
  flash *= Math.exp(-dt * 5); boltT -= dt;
  // parallax
  parX += (parT + Math.sin(t * .07) * .12 - parX) * (1 - Math.exp(-dt * 2.5));
}
function newDrop(any) { const near = Math.random() < .45; return { x: Math.random() * (W + 20) - 10, y: any ? Math.random() * H : -Math.random() * 30, l: near ? 4 + Math.random() * 4 : 2 + Math.random() * 2, v: near ? 260 + Math.random() * 80 : 170 + Math.random() * 50, near }; }
function newFlake(any) { const z = .4 + Math.random() * .8; return { x: Math.random() * W, y: any ? Math.random() * H : -2, v: 8 + z * 14, z, f: .5 + Math.random(), p: Math.random() * 6, s: z > 1 ? 2 : 1 }; }

  const pts = []; let x = W * (.15 + Math.random() * .7), y = 0; const end = H * (.35 + Math.random() * .2);
  pts.push([x, y]);
  while (y < end) { y += 3 + Math.random() * 6; x += (Math.random() - .5) * 9; pts.push([x, y]); }

/* ───────────── desen ───────────── */
function drawSky(Ev, t) {
  for (let y = 0; y < H; y++) {
    const f = y / H;
    const c = f < .55 ? mix(Ev.top, Ev.mid, f / .55) : mix(Ev.mid, Ev.hor, (f - .55) / .45);
    sc.fillStyle = rgba(c); sc.fillRect(0, y, W, 1);
  }
  // stele
  const sa = Ev.n * (1 - Ev.cloud) * (1 - Ev.fog);
  if (sa > .02) for (const s of stars) {
    const a = sa * s.b * (.6 + .4 * Math.sin(t * 1.3 + s.tw * 7));
    sc.fillStyle = `rgba(230,225,255,${a})`; sc.fillRect(s.x, s.y, 1, 1);
    if (s.big && a > .3) { sc.fillStyle = `rgba(230,225,255,${a * .35})`; sc.fillRect(s.x - 1, s.y, 3, 1); sc.fillRect(s.x, s.y - 1, 1, 3); }
  }
  // lună
  const mt = ((Ev.h - 18 + 24) % 24) / 12;
  if (mt > 0 && mt < 1) {
    const mx = Math.round(W * (.12 + .76 * mt)), my = Math.round(H * .06 + (1 - Math.sin(Math.PI * mt)) * H * .22);
    const ma = clamp(Ev.n * 1.2) * (1 - Ev.cloud * .75) * (1 - Ev.fog * .7);
    if (ma > .02) {
      const r = Math.max(4, Math.round(H * .022)), ph = moonPhase(), cp = Math.cos(2 * Math.PI * ph);
      for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
        const d = (x * x + y * y) / (r * r); if (d > 1) continue;
        const nx = x / r, ny = y / r, e = Math.sqrt(Math.max(0, 1 - ny * ny));
        const lit = ph < .5 ? nx > e * cp : nx < -e * cp;
        sc.fillStyle = lit ? `rgba(240,232,255,${ma})` : `rgba(60,50,90,${ma * .35})`;
        sc.fillRect(mx + x, my + y, 1, 1);
      }

      g.addColorStop(0, `rgba(200,190,255,${.45 * ma})`); g.addColorStop(1, 'rgba(0,0,0,0)');

$('bGeo').onclick = async () => { $('status').textContent = 'Cer acces la locație…'; if (await useGeolocation(true)) { ST.utcOffset = null; await loadWeather(); } else $('status').textContent = 'Locația nu e disponibilă.'; };
function toggleSound() { const on = Snd.toggle(); $('bSound').setAttribute('aria-pressed', on); sw.style.opacity = on ? 1 : .25; }
sw.style.opacity = .25;
$('bSound').onclick = toggleSound;
function toggleFull() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); }
$('bFull').onclick = toggleFull;
function togglePanel() { const o = $('panel').classList.toggle('open'); $('bPanel').setAttribute('aria-pressed', o); }
$('bPanel').onclick = togglePanel;
if (P.get('hud') === '0') document.body.classList.add('nohud');
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  const k = e.key.toLowerCase();
  if (k === 'h') document.body.classList.toggle('nohud');
  else if (k === 's') toggleSound();
  else if (k === 'f') toggleFull();
  else if (k === 'd') togglePanel();
  poke();
});
let idleT = 0;
function poke() { document.body.classList.remove('idle'); clearTimeout(idleT); if (!ST.autoHide) return; idleT = setTimeout(() => { if (ST.autoHide && !$('panel').classList.contains('open') && !document.querySelector('#wcard:hover')) document.body.classList.add('idle'); }, mobileQ.matches ? 7000 : 5000); }
addEventListener('pointermove', e => { parT = (e.clientX / innerWidth - .5) * 2; poke(); });
addEventListener('pointerdown', poke);
let rT = 0; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(resize, 150); });

/* ───────────── buclă ───────────── */
let lastT = performance.now(), T = 0, hudT = 0, sndT = 0, cardT = 0, gustF = 1;
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; T += dt;
  if (ST.timelapse) { ST.manualH = (ST.manualH + dt * .2) % 24; }
  const tw = targetWx(), k = 1 - Math.exp(-dt * .9);
  for (const key of SCENE_KEYS) cur[key] = lerp(cur[key], tw[key], k);
  // rafale: vântul pulsează peste valoarea medie
  gustF = 1 + cur.gust * 2.4 * Math.max(0, Math.sin(T * .45)) * Math.max(0, Math.sin(T * 1.7 + .7) * .7 + .3);
  E = computeEnv(T);
  const every = ST.timeMode === 'live' && !ST.timelapse ? 1000 : 110;
  if (now - lastRebuild > every) { rebuild(E); lastRebuild = now; }
  update(dt, E, T);
  render(E, T);
  if (now - hudT > 500) { updateHud(now - hudT > 500); hudT = now; if (ST.timeMode === 'manual') { $('tSlider').value = ST.manualH; $('mh').textContent = fmtH(ST.manualH); } }
  if (now - sndT > 1000) { Snd.update(E); sndT = now; }
  if (now - cardT > 20000) { updateSunBar(); cardT = now; }
  requestAnimationFrame(frame);
}

resize();
updateHud(true);
poke();
requestAnimationFrame(frame);
initLocation();
renderCard();
setInterval(loadWeather, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && ST.updated && Date.now() - ST.updated > 10 * 60 * 1000) loadWeather(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) lastT = performance.now(); });
window.__nn = { ST, get E() { return E; } };
})();
</script>
